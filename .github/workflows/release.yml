name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      AUTHOR: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MOD: SurvivorRandomizer
      PLUGIN: src/SurvivorRandomizer/Plugin.cs
      PROJECT: src/SurvivorRandomizer/SurvivorRandomizer.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare release
        run: >-
          python .github/scripts/prepare_release.py
          --project "$PROJECT"
          --plugin "$PLUGIN"
          --notes "$RUNNER_TEMP/release-notes.md"

      - name: Validate generated files
        run: git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build release
        run: dotnet build "$PROJECT" --configuration Release

      - name: Verify release files
        shell: bash
        run: |
          test -f "dist/BepInEx/plugins/$MOD/$MOD.dll"
          for file in icon.png manifest.json README.md CHANGELOG.md normal.png; do
            test -f "dist/$file"
          done
          jq -e --arg version "$VERSION" '.version_number == $version' dist/manifest.json >/dev/null

      - name: Create ZIP
        shell: bash
        run: |
          cd dist
          zip -r "../$AUTHOR-$MOD-$VERSION.zip" BepInEx icon.png manifest.json README.md CHANGELOG.md normal.png

      - name: Commit version and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN" "$PROJECT" manifest.json CHANGELOG.md
          git diff --cached --quiet && { echo "Release preparation produced no changes." >&2; exit 1; }
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$MOD $TAG"
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "refs/tags/$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG"
          "$AUTHOR-$MOD-$VERSION.zip"
          --verify-tag
          --title "$MOD $TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
